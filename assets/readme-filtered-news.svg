<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">NotForMe filters a news list</title>
  <desc id="desc">A fictional news list shows promotional articles collapsed while a technology article remains visible.</desc>
