<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">NotForMe on a ZDNet Korea style news list</title>
  <desc id="desc">A ZDNet Korea style news page shows promotional articles as compact collapsed bars while technology news remains visible.</desc>
  <defs>
    <linearGradient id="lead" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d344d"/><stop offset="1" stop-color="#4b91a7"/></linearGradient>
    <linearGradient id="thumbA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2e9ef"/><stop offset="1" stop-color="#9db8c5"/></linearGradient>
    <linearGradient id="thumbC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dce8f7"/><stop offset="1" stop-color="#7b9bd0"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#12202d" flood-opacity=".08"/></filter>
  </defs>
  <rect width="1440" height="920" fill="#f7f7f7"/>
  <rect width="1440" height="74" fill="#ffffff"/>
  <rect y="73" width="1440" height="1" fill="#e5e7ea"/>
  <g font-family="Arial, 'Apple SD Gothic Neo', sans-serif">
    <text x="120" y="47" fill="#1c2733" font-size="28" font-weight="800" letter-spacing="-1.5">ZDNET</text>
    <text x="226" y="47" fill="#2e6f9d" font-size="18" font-weight="700">KOREA</text>
    <text x="330" y="46" fill="#9aa1a8" font-size="12">IT세상을 바꾸는 힘</text>
    <text x="1110" y="45" fill="#70777f" font-size="13">로그인</text><text x="1162" y="45" fill="#70777f" font-size="13">구독</text>
    <circle cx="1278" cy="37" r="14" fill="none" stroke="#68717a" stroke-width="2"/><path d="M1288 47l10 10" stroke="#68717a" stroke-width="2" stroke-linecap="round"/>
  </g>
  <rect y="74" width="1440" height="52" fill="#ffffff"/><rect y="124" width="1440" height="2" fill="#f15a3a"/>
  <g font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="600">
    <text x="122" y="107" fill="#20262c">뉴스</text><text x="184" y="107" fill="#69727b">ZDPick</text><text x="270" y="107" fill="#69727b">국감2026</text><text x="374" y="107" fill="#69727b">인공지능</text><text x="482" y="107" fill="#69727b">IT'sight</text><text x="570" y="107" fill="#69727b">칼럼·연재</text><text x="696" y="107" fill="#69727b">포토·영상</text>
  </g>
  <text x="130" y="170" fill="#969da4" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="12">홈  ·  뉴스</text>
  <text x="130" y="216" fill="#20262c" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="800">이 시각 주요뉴스</text>
  <text x="130" y="243" fill="#9299a0" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="13">2026년 10월 31일 토요일</text><rect x="130" y="262" width="1180" height="1" fill="#222a31"/>
  <rect x="130" y="286" width="566" height="214" fill="url(#lead)" filter="url(#shadow)"/>
  <circle cx="590" cy="342" r="74" fill="#b4e5ee" opacity=".22"/><circle cx="622" cy="382" r="116" fill="#0b253c" opacity=".2"/><path d="M424 447c56-90 103-91 155-34 31 34 60 41 93-7" fill="none" stroke="#d9f2f3" stroke-width="6" opacity=".65"/>
  <g font-family="Arial, 'Apple SD Gothic Neo', sans-serif"><text x="158" y="326" fill="#ffffff" font-size="12" font-weight="700">AI·보안</text><text x="158" y="424" fill="#ffffff" font-size="25" font-weight="800">오픈소스 프로젝트가 새 보안 기능을 공개했다</text><text x="158" y="458" fill="#dcebef" font-size="14">개발자와 기업 사용자를 위한 접근 제어 기능을 추가했다</text></g>
  <rect x="724" y="286" width="586" height="214" fill="#ffffff" filter="url(#shadow)"/>
  <g font-family="Arial, 'Apple SD Gothic Neo', sans-serif"><text x="752" y="324" fill="#e55a3c" font-size="12" font-weight="700">주요 뉴스</text><text x="752" y="363" fill="#20262c" font-size="20" font-weight="700">AI 모델마다 성능·가격 다른데</text><text x="752" y="391" fill="#20262c" font-size="20" font-weight="700">기업은 어떻게 골라 쓸까</text><text x="752" y="429" fill="#7c858d" font-size="13">서비스 선택 기준과 실제 운영 비용을 짚어봤다</text><line x1="752" y1="451" x2="1280" y2="451" stroke="#eceeef"/><text x="752" y="478" fill="#5d6871" font-size="14">엔비디아, 40개 언어 받아쓰는 오픈 음성인식 모델 공개</text></g>
  <text x="130" y="548" fill="#20262c" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="21" font-weight="800">최신 기사</text><text x="1242" y="548" fill="#9aa1a8" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="12">더보기  ›</text><rect x="130" y="566" width="1180" height="1" fill="#222a31"/>
  <rect x="130" y="584" width="1180" height="100" fill="#ffffff"/><rect x="154" y="600" width="142" height="68" fill="url(#thumbA)"/><circle cx="228" cy="634" r="24" fill="#eaf5f7" opacity=".8"/><path d="M184 649l36-33 20 17 29-25 25 32z" fill="#6d98a7" opacity=".8"/>
  <g font-family="Arial, 'Apple SD Gothic Neo', sans-serif"><text x="320" y="612" fill="#4b7898" font-size="12" font-weight="700">기술</text><text x="320" y="640" fill="#222a31" font-size="19" font-weight="700">클라우드 보안 설정, 개발자가 확인해야 할 네 가지</text><text x="320" y="665" fill="#899198" font-size="13">서비스 운영 환경에서 자주 놓치는 권한 설정을 정리했다</text></g>
  <rect x="130" y="696" width="1180" height="44" fill="#ffffff"/><rect x="154" y="700" width="1132" height="36" fill="#f4f5f7" stroke="#b9bec7"/><rect x="154" y="700" width="3" height="36" fill="#b9bec7"/>
  <g font-family="Arial, 'Apple SD Gothic Neo', sans-serif"><text x="176" y="723" fill="#3d4452" font-size="12" font-weight="700">광고성 PR</text><text x="258" y="723" fill="#5b6270" font-size="12">신규 매장 오픈 기념, 한정 할인 행사를 시작합니다</text><text x="1228" y="723" fill="#5b6270" font-size="12" text-anchor="end" text-decoration="underline">보기</text></g>
  <rect x="130" y="752" width="1180" height="100" fill="#ffffff"/><rect x="154" y="768" width="142" height="68" fill="url(#thumbC)"/><rect x="173" y="786" width="96" height="30" rx="4" fill="#eef5ff" opacity=".75"/><path d="M184 808h74M184 798h53" stroke="#5275a8" stroke-width="4" stroke-linecap="round" opacity=".8"/>
  <g font-family="Arial, 'Apple SD Gothic Neo', sans-serif"><text x="320" y="780" fill="#4b7898" font-size="12" font-weight="700">인공지능</text><text x="320" y="808" fill="#222a31" font-size="19" font-weight="700">기업용 AI 도구, 데이터 보호 기능을 강화한다</text><text x="320" y="833" fill="#899198" font-size="13">업무 데이터가 외부로 나가지 않도록 관리 기능을 추가했다</text></g>
  <rect x="130" y="864" width="1180" height="44" fill="#ffffff"/><rect x="154" y="868" width="1132" height="36" fill="#f4f5f7" stroke="#b9bec7"/><rect x="154" y="868" width="3" height="36" fill="#b9bec7"/>
  <g font-family="Arial, 'Apple SD Gothic Neo', sans-serif"><text x="176" y="891" fill="#3d4452" font-size="12" font-weight="700">광고성 PR</text><text x="258" y="891" fill="#5b6270" font-size="12">브랜드 협업 제품과 팝업 전시를 공개했습니다</text><text x="1228" y="891" fill="#5b6270" font-size="12" text-anchor="end" text-decoration="underline">보기</text></g>
</svg>
